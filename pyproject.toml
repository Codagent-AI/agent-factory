[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-factory"
version = "0.0.0"
description = "Controller for Codagent's unattended evaluation and improvement workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Codagent" },
]
dependencies = []

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=8.4.2",
  "ruff>=0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
