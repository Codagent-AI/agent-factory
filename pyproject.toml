[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-factory"
version = "0.0.0"
description = "Controller for Codagent's unattended evaluation and improvement workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Codagent" },
]
dependencies = []

[project.scripts]
agent-factory = "agent_factory.cli:main"

[dependency-groups]
dev = [
  "graphql-core>=3.2,<3.3",
  "pyright>=1.1.405",
  "pytest>=8.4.2",
  "ruff>=0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]
force-include = { "packaging/launchd/com.codagent.agent-factory.plist" = "share/agent-factory/launchd/com.codagent.agent-factory.plist" }

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# Docker-dependent tests are deselected by default: this project runs its fixes on the host,
# and a machine without a responsive daemon would otherwise stall on every Docker call.
# Run them with `pytest -m docker` on a Docker-enabled host.
addopts = "--strict-config --strict-markers -m 'not docker'"
testpaths = ["tests"]
markers = [
  "darwin: requires macOS process-session semantics",
  "docker: requires a Docker-enabled host and test-owned containers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
