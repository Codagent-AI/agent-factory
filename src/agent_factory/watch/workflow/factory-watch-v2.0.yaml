# factory-contract: factory-watch/2
name: factory-watch
description: "Check a ready PR for factory defects or triage a factory failure in a fresh headless session."
hidden: true
params:
  - name: brief_file
    required: true
  - name: artifact_dir
    required: true
  - name: contract_version
    required: true
sessions:
  - name: watcher
    agent: watcher
steps:
  - id: check-contract
    script: check-contract.sh
    script_inputs:
      expected_contract: factory-watch/2
      declared_contract: "{{contract_version}}"
  - id: watch
    session: watcher
    mode: autonomous
    prompt: |
      Read {{brief_file}} and follow its procedure without asking questions.
      For pr-check, follow .claude/skills/factory-triage/SKILL.md Headless PR-READY check.
      For triage, follow .claude/skills/factory-triage/SKILL.md Headless triage.
      Look only for defects in the factory stack and file issues for them. Do not
      review the pull request's code or comment on it, and do not fix anything:
      no branches, commits, pushes, or pull requests. Do not deploy or merge.
      Write exactly one JSON object to {{artifact_dir}}/watch-result.json in the
      schema required by that headless procedure.
  - id: check-result
    script: check-result.sh
    script_inputs:
      result_file: "{{artifact_dir}}/watch-result.json"
