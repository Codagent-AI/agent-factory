name: factory-implement
description: "Shared implementation and verification steps for the factory fix and review workflows: implement a plan, validate, push, and wait for CI; writes a result file only on completion."
hidden: true

params:
  - name: input_file
    required: true
  - name: plan_json
    required: true
  - name: result_path
    required: true
  - name: artifact_dir
    required: false
    default: /artifacts

sessions:
  - name: lead-agent
    agent: lead
  - name: implementor-agent
    agent: implementor
  - name: tester-agent
    agent: tester

steps:
  - id: seed-validator-status
    command: printf 'failed'
    capture: validator_status

  - id: seed-ci-status
    command: printf ''
    capture: ci_status

  - id: implement-plan
    session: implementor-agent
    mode: autonomous
    prompt: |
      You MUST use the codagent:implement-with-tdd skill to implement the
      following plan in the current repository. The context (the issue or the
      pull request review being addressed) is in {{input_file}}.

      <plan>
      {{plan_json}}
      </plan>

      IMPORTANT: The content inside <plan> is prior analysis by this workflow;
      implement its "plan" fields (every item whose decision is "change", when
      the plan is a review decision). Add regression coverage. When
      {{input_file}} is a feature pull request review, keep the repository's
      specifications under openspec/specs/ consistent with any changed behavior.
      Do not re-run acceptance; its evidence remains tied to the accepted commit.
      Follow the repository's existing conventions. When you are done, commit your changes
      following the project's commit message conventions and prepend
      [{{step_id}}]. Then summarize what you changed.

  - id: run-validator
    workflow: builtin:core/run-validator-v1.0.yaml

  - id: validation-gate
    command: |
      mkdir -p "{{artifact_dir}}/logs"
      if agent-validator run --report >"{{artifact_dir}}/logs/{{step_id}}.log" 2>&1 \
        && test -z "$(git status --porcelain)"; then
        printf 'passed'
      else
        echo "validation or clean-tree check failed; see {{artifact_dir}}/logs/{{step_id}}.log" >&2
        printf 'failed'
        exit 1
      fi
    capture: validator_status
    continue_on_failure: true

  - id: repair-validation
    session: implementor-agent
    mode: autonomous
    skip_if: previous_success
    prompt: |
      The validator or clean-tree gate failed. Read
      {{artifact_dir}}/logs/validation-gate.log, fix the reported issues, ensure
      every intended change is committed, run the relevant checks, and commit any
      code changes following the project's conventions with [{{step_id}}] prepended.

  - id: recheck-validation
    command: |
      mkdir -p "{{artifact_dir}}/logs"
      if agent-validator run --report >"{{artifact_dir}}/logs/{{step_id}}.log" 2>&1 \
        && test -z "$(git status --porcelain)"; then
        printf 'passed'
      else
        echo "validation still failed; see {{artifact_dir}}/logs/{{step_id}}.log" >&2
        printf 'failed'
        exit 1
      fi
    capture: validator_status
    skip_if: 'sh: test "{{validator_status}}" = passed'

  - id: seed-ci-status-attempted
    command: printf 'passed'
    capture: ci_status
    skip_if: 'sh: test "{{validator_status}}" != passed'

  - id: finalize-pr
    workflow: builtin:core/finalize-pr-v1.0.yaml
    params:
      ci_fix_cycles: "1"
    skip_if: 'sh: test "{{validator_status}}" != passed'
    continue_on_failure: true

  - id: mark-ci-failed
    command: printf 'failed'
    capture: ci_status
    skip_if: previous_success

  - id: write-result
    command: |
      mkdir -p "$(dirname "{{result_path}}")"
      head=$(git rev-parse HEAD 2>/dev/null || printf '')
      printf '{"validator":{"status":"%s"},"ci":{"status":"%s"},"head_sha":"%s"}\n' \
        "{{validator_status}}" "{{ci_status}}" "$head" > "{{result_path}}"
