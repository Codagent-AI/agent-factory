# factory-contract: factory-fix/1
name: factory-fix
description: "Triage a reported bug and either fix it through the Runner's implement-change, with its crosscheck audit and single validator run, or decline with reasons; writes exactly one outcome to fix-outcome.json."
hidden: true

params:
  - name: issue_file
    required: true
  - name: branch_name
    required: true
  - name: contract_version
    required: true
  # Where the outcome and logs go: the sandbox's /artifacts mount by default, or the
  # attempt's evidence directory when the factory runs the workflow on the host.
  - name: artifact_dir
    required: false
    default: /artifacts

sessions:
  - name: lead-agent
    agent: lead

steps:
  - id: check-contract
    script: check-contract.sh
    script_inputs:
      expected_contract: factory-fix/1
      declared_contract: "{{contract_version}}"

  - id: check-clean-tree
    command: |
      if [ -n "$(git status --porcelain)" ]; then
        echo "expected a clean working tree at the recorded commit before triage" >&2
        exit 1
      fi

  - id: triage
    session: lead-agent
    mode: autonomous
    capture: triage_decision
    prompt: |
      You are triaging a bug report to decide whether it is safely fixable without
      human input. Read the issue file at {{issue_file}}. It contains the
      repository, issue number, title, body, this attempt's number, any prior
      factory pull request for this issue, and any eligible comments (including,
      on a re-attempt, the writer's comments answering a prior decline).

      Decide whether the bug is fixable by an autonomous coding agent, following
      the repository's own conventions, with no human decision required. Decline
      (fixable: false) rather than guess when any of the following holds:

      - The problem stems from a CLI, platform, or dependency limitation this
        agent cannot change.
      - Several viable solutions exist that would change behavior differently,
        and a human needs to choose between them. Name the options and exactly
        what needs to be decided.
      - The report lacks enough detail to reproduce the problem.
      - The fix would require changes outside this target repository.
      - The fix would require a non-trivial specification change. Say "belongs
        in a Feature" as the reason. A trivial inline specification update made
        as part of the fix itself is fine and does not require declining.

      If this is a re-attempt (attempt number greater than 1) and prior factory
      PR or writer comments are present, treat those comments as the answers to
      whatever caused the prior decline, and re-evaluate fixability in light of
      them.

      Respond with exactly one JSON object and nothing else: no prose before or
      after it, no markdown code fence. The object must have exactly these
      fields:

      - "fixable" (boolean, required)
      - "reasons" (array of strings, required): why you declined, naming
        specific options or gaps when relevant. Empty array when fixable.
      - "plan" (string, required): when fixable, a concrete implementation plan
        (what to change, what regression test to add, following the
        repository's conventions). Empty string when not fixable.

      Example valid output:
      {"fixable": true, "reasons": [], "plan": "Fix the off-by-one in page.go's paginate() and add a regression test covering the last page."}

  - id: record-triage
    script: record-triage.sh
    script_inputs:
      decision: "{{triage_decision}}"
      outcome_path: "{{artifact_dir}}/fix-outcome.json"
    capture: fixable
    continue_on_failure: true

  - id: repair-triage
    session: lead-agent
    mode: autonomous
    skip_if: previous_success
    capture: triage_decision
    prompt: |
      Your triage response could not be parsed. Re-read {{issue_file}} and return
      exactly one JSON object with the required fixable, reasons, and plan fields.
      Return no prose and no markdown fence.

  - id: recheck-triage
    script: record-triage.sh
    script_inputs:
      decision: "{{triage_decision}}"
      outcome_path: "{{artifact_dir}}/fix-outcome.json"
    capture: fixable
    skip_if: 'sh: test "{{fixable}}" = true || test "{{fixable}}" = false'

  - id: seed-skipped-implement-status
    command: printf 'failed'
    capture: implement_status

  - id: seed-skipped-implement-completed
    command: printf 'failed'
    capture: implement_completed

  - id: implement
    skip_if: 'sh: test {{fixable}} != true'
    continue_on_failure: true
    steps:
      - id: seed-implement-status
        command: printf 'failed'
        capture: implement_status

      - id: seed-implement-completed
        command: printf 'failed'
        capture: implement_completed

      - id: seed-validator-status
        command: printf 'passed'
        capture: validator_status

      - id: seed-implement-result
        command: printf 'failed'
        capture: implement_result

      - id: seed-ci-status
        command: printf ''
        capture: ci_status

      - id: seed-pr-details
        command: printf '{}'
        capture: pr_details

      - id: create-branch
        command: git checkout -b "{{branch_name}}"

      # The Runner's implement-change needs a defined change. A fix gets a small one, kept
      # outside the repository with the checklist and audit records, so the pull request
      # carries only the fix.
      - id: change-name
        command: printf '%s' "{{branch_name}}" | sed 's#^factory/##; s#/#-#g'
        capture: change_name

      - id: prepare-definition
        command: mkdir -p "{{artifact_dir}}/definition"

      - id: define-fix
        session: lead-agent
        mode: autonomous
        prompt: |
          Define the fix for the bug reported in {{issue_file}} so it can be implemented and
          audited against its stated behavior. Your triage decision was:

          <triage-decision>
          {{triage_decision}}
          </triage-decision>

          Write four small artifacts under `{{artifact_dir}}/definition/` and nothing in the
          repository. Use the issue and your plan only; do not implement, widen the scope, or
          settle a product decision the issue leaves open.

          - `proposal.md`: the problem, its cause as far as triage found it, what changes, and
            what is out of scope.
          - `specs/behavior/spec.md`: the corrected behavior as requirements. Each starts with
            `### Requirement: <name>` and states what the system SHALL do; each has one or more
            `#### Scenario: <name>` blocks with `- **WHEN** ...` and `- **THEN** ...` lines.
            Include a scenario that reproduces the reported failure and states the correct
            result, one for each failure mode the plan names, and a requirement that the
            repository's automated tests include a regression test that triggers the reported
            failure and asserts the corrected behavior. If the fix changes behavior the
            repository's own specifications under `openspec/specs/` describe, add a requirement
            that those specifications are updated to match.
          - `design.md`: the components the fix touches and the approach, taken from your plan.
          - `test-plan.md`: the automated tests to add or run, each unit or integration. State
            under a `## Testing envelope` heading that agent acceptance testing is not required
            beyond the automated tests unless the issue reports a flow a user runs, and name
            that flow if so.

      - id: add-constraints
        script: add-constraints.sh
        script_inputs:
          design_file: "{{artifact_dir}}/definition/design.md"
          kind: fix

      # implement-change runs the lead's and the implementor's checklists, merged by the
      # crosscheck; the implementation; the crosscheck's audit and the fixes it asks for; and
      # verify-change, whose one validator run (with bounded repair) precedes the draft pull
      # request and acceptance.
      - id: implement-change
        continue_on_failure: true
        steps:
          - id: change
            workflow: builtin:core/implement-change-v2.0.yaml
            params:
              change_name: "{{change_name}}"
              change_dir: "{{artifact_dir}}/definition"
              change_label: "fix"
              change_kind: "spec-driven"
              artifact_validation_instruction: "No artifact validation applies: the definition lives outside the repository."
              skip_validator: "false"

          - id: mark-change-passed
            command: printf 'passed'
            capture: implement_result

      - id: mark-change-failed
        command: printf 'failed'
        capture: validator_status
        skip_if: 'sh: test "{{implement_result}}" != failed'

      # An implementation the lead ruled cannot be done without the user is a question.
      - id: record-change-blocked
        script: record-blocked.sh
        script_inputs:
          contract: factory-fix/1
          outcome_path: "{{artifact_dir}}/fix-outcome.json"
          blocked_file: "{{session_dir}}/output/implementation-blocked.md"
          branch_name: "{{branch_name}}"
        skip_if: 'sh: test "{{implement_result}}" != failed'

      # A failure inside verification becomes a failed outcome with its reason. A failure
      # before it ends the workflow without an outcome, which the factory retries.
      - id: record-change-failure
        command: python3 .agent-runner/workflows/verify-failure.py "{{session_dir}}" "{{artifact_dir}}" --require-evidence
        skip_if: 'sh: test "{{implement_result}}" != failed || test -s {{artifact_dir}}/fix-outcome.json'

      - id: mark-implemented
        command: printf 'passed'
        capture: implement_status

      - id: seed-ci-status-attempted
        command: printf 'passed'
        capture: ci_status
        skip_if: 'sh: test "{{validator_status}}" != passed'

      - id: finalize-pr
        workflow: builtin:core/finalize-pr-v1.0.yaml
        params:
          ci_fix_cycles: "3"
        skip_if: 'sh: test "{{validator_status}}" != passed'
        continue_on_failure: true

      - id: mark-ci-failed
        command: printf 'failed'
        capture: ci_status
        skip_if: previous_success

      - id: record-pr-details
        command: |
          if ! command -v gh >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            printf '{}'
            exit 0
          fi
          branch=$(git branch --show-current) || { printf '{}'; exit 0; }
          result=$(gh pr list --head "$branch" --state open --json url,number,headRefOid --limit 1 | jq -c '.[0] // {}')
          printf '%s' "$result"
        capture: pr_details
        continue_on_failure: true

      - id: annotate-pr
        continue_on_failure: true
        command: |
          # Factory reconciliation and merge sync read the issue reference and the
          # claim marker from the PR body; "Refs" links without closing the issue, since
          # the factory closes it itself after the merge sync succeeds.
          if ! command -v gh >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
            exit 0
          fi
          branch=$(git branch --show-current) || exit 0
          number=$(gh pr list --head "$branch" --state open --json number --limit 1 \
            | python3 -c 'import json,sys; v=json.load(sys.stdin); print(v[0]["number"] if v else "")')
          [ -n "$number" ] || exit 0
          body=$(gh api "repos/{owner}/{repo}/pulls/$number" --jq '.body // ""')
          case "$body" in
            *"agent-factory:claim:"*) exit 0 ;;
          esac
          header=$(python3 - "{{issue_file}}" <<'PY'
          import json, sys
          issue = json.load(open(sys.argv[1]))
          print(f"Refs #{issue.get('number', '')}")
          print(f"<!-- agent-factory:claim:{issue.get('claim_id', '')} -->")
          PY
          )
          # REST, not the gh PR editor: it reads projectItems over GraphQL, which a fix token cannot.
          printf '%s\n\n%s\n' "$header" "$body" \
            | gh api -X PATCH "repos/{owner}/{repo}/pulls/$number" -F body=@- >/dev/null

      - id: refresh-loc
        continue_on_failure: true
        script: count-loc.py
        script_inputs:
          mode: refresh-pr
          artifact_dir: "{{artifact_dir}}"

      - id: mark-implement-completed
        command: printf 'passed'
        capture: implement_completed

  - id: record-outcome
    script: record-outcome.sh
    skip_if: 'sh: test {{fixable}} != true || test "{{implement_status}}" != passed || test -s {{artifact_dir}}/fix-outcome.json'
    script_inputs:
      contract: factory-fix/1
      outcome_path: "{{artifact_dir}}/fix-outcome.json"
      implement_completed: "{{implement_completed}}"
      validator_status: "{{validator_status}}"
      ci_status: "{{ci_status}}"
      branch_name: "{{branch_name}}"
      pr_details: "{{pr_details}}"
      verify_failure: "{{artifact_dir}}/verify-failure.json"

  - id: verify-outcome
    command: |
      if [ ! -s "{{artifact_dir}}/fix-outcome.json" ]; then
        if [ "{{fixable}}" = true ] && [ "{{implement_status}}" != passed ]; then
          echo "implementor step did not complete" >&2
        fi
        echo "fix-outcome.json was not written; treating this run as a technical failure" >&2
        exit 1
      fi
      if command -v jq >/dev/null 2>&1; then
        outcome=$(jq -r '.outcome // empty' "{{artifact_dir}}/fix-outcome.json")
      else
        outcome=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("outcome",""))' "{{artifact_dir}}/fix-outcome.json")
      fi
      case "$outcome" in
        pull-request|needs-input|failed) ;;
        *)
          echo "fix-outcome.json has an invalid or missing outcome: $outcome" >&2
          exit 1
          ;;
      esac
