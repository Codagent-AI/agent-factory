# factory-contract: factory-feature/1
name: factory-feature
description: "Define an OpenSpec feature, implement it through the Runner's implement-change with its crosscheck audit and single validator run, archive it, and finalize the pull request."
hidden: true
params:
  - name: issue_file
    required: true
  - name: branch_name
    required: true
  - name: change_name
    required: true
  - name: contract_version
    required: true
  - name: artifact_dir
    default: /artifacts
  - name: resume_from
    default: ""
  - name: prior_branch
    default: ""
  - name: base_head
    default: ""
sessions:
  - name: lead-agent
    agent: lead
steps:
  - id: check-contract
    script: check-contract.sh
    script_inputs:
      expected_contract: factory-feature/1
      declared_contract: "{{contract_version}}"
  - id: check-openspec
    script: check-openspec.sh
    script_inputs:
      artifact_dir: "{{artifact_dir}}"
  # A stop recorded earlier skips the capturing steps; later steps still read their values.
  - id: seed-target-head
    command: printf ''
    capture: target_head
  - id: seed-effective-resume
    command: printf ''
    capture: effective_resume
  - id: target-head
    command: git rev-parse HEAD
    capture: target_head
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json'
  - id: prepare-branch
    script: prepare-branch.sh
    script_inputs:
      branch_name: "{{branch_name}}"
      target_head: "{{target_head}}"
      resume_from: "{{resume_from}}"
      prior_branch: "{{prior_branch}}"
      artifact_dir: "{{artifact_dir}}"
      base_head: "{{base_head}}"
    capture: effective_resume
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json'
  - id: resolve-merge
    session: lead-agent
    mode: autonomous
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test ! -s {{artifact_dir}}/merge-conflict.json'
    prompt: |
      Follow `.agent-runner/workflows/factory-define-rules.md`. Read
      {{artifact_dir}}/merge-conflict.json and {{issue_file}}, including eligible
      answers to prior merge questions. Resolve every conflict while keeping both
      sides' intent. In the merge commit, edit only paths listed under conflicted
      in merge-conflict.json. Never reset, rebase, squash, or amend. Finish the
      merge with git commit --no-edit first. Do not run Agent Validator: the
      attempt's single validator run covers the merged tree. If the conflict cannot
      be resolved within these rules, write
      {{artifact_dir}}/merge-stop.json with non-empty questions and
      direction_summary, and leave the merge in progress.
  - id: check-merge
    script: check-merge.sh
    script_inputs:
      artifact_dir: "{{artifact_dir}}"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test ! -s {{artifact_dir}}/merge-conflict.json || test -s {{artifact_dir}}/merge-stop.json'
  - id: record-merge-stop
    script: record-merge-stop.sh
    script_inputs:
      artifact_dir: "{{artifact_dir}}"
      branch_name: "{{branch_name}}"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test ! -s {{artifact_dir}}/merge-stop.json'
  - id: continue-change
    script: continue-change.sh
    script_inputs:
      prior_branch: "{{prior_branch}}"
      change_name: "{{change_name}}"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test -z "{{prior_branch}}"'
  - id: create-change
    command: mkdir -p "openspec/changes/{{change_name}}"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test -d openspec/changes/{{change_name}} || .agent-runner/workflows/factory-resume-skip.sh "{{effective_resume}}" implement'
  - id: reconcile-artifacts
    session: lead-agent
    mode: autonomous
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test -s {{artifact_dir}}/resume.json || .agent-runner/workflows/reconcile-skip.sh "{{effective_resume}}" "{{prior_branch}}"'
    prompt: |
      Follow `.agent-runner/workflows/factory-define-rules.md`.
      On a direction-level stop, write {{artifact_dir}}/define-stop.json.
      Compare openspec/changes/{{change_name}} with {{issue_file}} and its eligible comments.
      Revise artifacts where warranted and append each revision to decisions.md.
  - id: record-stop-reconcile
    script: record-stop.sh
    script_inputs:
      artifact_dir: "{{artifact_dir}}"
      branch_name: "{{branch_name}}"
      step: "{{effective_resume}}"
    skip_if: 'sh: test ! -s {{artifact_dir}}/define-stop.json || test -s {{artifact_dir}}/feature-outcome.json'
  - id: define
    workflow: factory-define-v2.0.yaml
    params:
      issue_file: "{{issue_file}}"
      branch_name: "{{branch_name}}"
      change_name: "{{change_name}}"
      artifact_dir: "{{artifact_dir}}"
      resume_from: "{{effective_resume}}"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || .agent-runner/workflows/factory-resume-skip.sh "{{effective_resume}}" implement'
  # Verification the attempt must run itself: it resumed past implement-change, which
  # verifies the change it implements, without a checkpoint that records verification as done.
  - id: seed-verify-pending
    command: printf false
    capture: verify_pending
  - id: verify-pending
    script: verify-pending.sh
    script_inputs:
      resume_from: "{{effective_resume}}"
      target_head: "{{target_head}}"
      artifact_dir: "{{artifact_dir}}"
    capture: verify_pending
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json'
  # Everything below reads validator_status: it stays passed unless a step fails.
  - id: seed-validator-status
    command: printf passed
    capture: validator_status
  - id: seed-implement-result
    command: if test -s {{artifact_dir}}/feature-outcome.json || .agent-runner/workflows/factory-resume-skip.sh "{{effective_resume}}" implement; then printf skipped; else printf failed; fi
    capture: implement_result
  - id: implement-change
    continue_on_failure: true
    skip_if: 'sh: test "{{implement_result}}" = skipped'
    steps:
      - id: add-constraints
        script: add-constraints.sh
        script_inputs:
          design_file: "openspec/changes/{{change_name}}/design.md"
          kind: feature
      # The Runner's implement-change: the lead's and the implementor's checklists merged by the
      # crosscheck, implementation against it, the crosscheck's audit and the findings fixed,
      # then verify-change with the change's one validator run, the draft pull request, and
      # acceptance.
      - id: implement
        workflow: builtin:core/implement-change-v2.0.yaml
        params:
          change_name: "{{change_name}}"
          change_dir: "openspec/changes/{{change_name}}"
          change_label: "feature"
          change_kind: "openspec"
          artifact_validation_instruction: 'When an approved artifact changed, run `openspec validate --type change "{{change_name}}"`.'
          skip_validator: "false"
      - id: mark-implement-passed
        command: printf passed
        capture: implement_result
  - id: mark-implement-failed
    command: printf failed
    capture: validator_status
    skip_if: 'sh: test "{{implement_result}}" != failed'
  # An implementation the lead ruled cannot be done without the user is a question, not a failure.
  - id: record-implement-blocked
    script: record-blocked.sh
    script_inputs:
      contract: factory-feature/1
      outcome_path: "{{artifact_dir}}/feature-outcome.json"
      blocked_file: "{{session_dir}}/output/implementation-blocked.md"
      branch_name: "{{branch_name}}"
    skip_if: 'sh: test "{{implement_result}}" != failed'
  # A failure inside verification becomes a failed outcome with its reason. A failure before
  # it ends this workflow without an outcome, which the factory retries as a technical failure.
  - id: record-implement-failure
    command: python3 .agent-runner/workflows/verify-failure.py "{{session_dir}}" "{{artifact_dir}}" --require-evidence
    skip_if: 'sh: test "{{implement_result}}" != failed || test -s {{artifact_dir}}/feature-outcome.json'
  - id: complete-implement
    script: checkpoint.sh
    script_inputs:
      phase: implemented
      branch_name: "{{branch_name}}"
      change_name: "{{change_name}}"
      verify_pending: "false"
    skip_if: 'sh: test "{{implement_result}}" != passed'
  # Capture the skip decision before archive changes the working tree. The change is
  # archived after verification, as in the Runner's change workflow, so verification and
  # acceptance saw the change in place; the archive commit is the only commit after them.
  - id: seed-archive-status
    command: if test -s {{artifact_dir}}/feature-outcome.json || test "{{validator_status}}" != passed || test ! -d openspec/changes/{{change_name}}; then printf skipped; else printf passed; fi
    capture: archive_status
  - id: archive
    workflow: builtin:openspec/archive-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
    continue_on_failure: true
    skip_if: 'sh: test "{{archive_status}}" = skipped'
  - id: mark-archive-failed
    command: if test "{{archive_status}}" = skipped; then printf skipped; else printf failed; fi
    capture: archive_status
    skip_if: previous_success
  - id: record-archive-block
    script: record-archive-block.sh
    script_inputs:
      artifact_dir: "{{artifact_dir}}"
      branch_name: "{{branch_name}}"
      session_dir: "{{session_dir}}"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test "{{archive_status}}" != failed'
  - id: push-archive
    script: checkpoint.sh
    script_inputs:
      phase: archived
      branch_name: "{{branch_name}}"
      verify_pending: "{{verify_pending}}"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test "{{archive_status}}" != passed'
  - id: locate-archive
    command: python3 .agent-runner/workflows/locate-archive.py "{{change_name}}"
    capture: archived_dir
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test "{{validator_status}}" != passed'
  # A resume at archive or verify from a checkpoint that predates verification (a plan
  # implemented under the earlier workflow, or a draft pull request left by a crash inside
  # implement-change) verifies the archived change on its own.
  - id: seed-verify-result
    command: if test -s {{artifact_dir}}/feature-outcome.json || test "{{validator_status}}" != passed || test "{{verify_pending}}" != true; then printf skipped; else printf failed; fi
    capture: verify_result
  - id: verify-change
    continue_on_failure: true
    skip_if: 'sh: test "{{verify_result}}" = skipped'
    steps:
      - id: verify
        workflow: builtin:core/verify-change-v1.0.yaml
        params:
          change_name: "{{change_name}}"
          change_dir: "{{archived_dir}}"
          change_label: "feature"
          artifact_validation_instruction: "run openspec validate --specs --strict"
          skip_validator: "false"
          acceptance_fix_scope: "Resolve every high-confidence finding in this change's own implementation, specs, and tests. Do not edit workflow files (.github/workflows or any CI configuration), and do not add CI checks or test suites. Record CI, PR-state, tooling, setup, and environmental problems in the assumptions ledger instead of fixing them."
      - id: mark-verify-passed
        command: printf passed
        capture: verify_result
  - id: mark-verify-failed
    command: printf failed
    capture: validator_status
    skip_if: 'sh: test "{{verify_result}}" != failed'
  - id: record-verify-failure
    command: python3 .agent-runner/workflows/verify-failure.py "{{session_dir}}" "{{artifact_dir}}"
    skip_if: 'sh: test "{{verify_result}}" != failed'
  - id: push-verified
    script: checkpoint.sh
    script_inputs:
      phase: archived
      branch_name: "{{branch_name}}"
      verify_pending: "false"
    skip_if: 'sh: test "{{verify_result}}" != passed'
  - id: classify
    session: lead-agent
    mode: autonomous
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test "{{validator_status}}" != passed'
    prompt: |
      Follow `.agent-runner/workflows/factory-define-rules.md`.
      Read {{issue_file}} and its settled decisions, {{archived_dir}}/decisions.md,
      and the review findings in {{artifact_dir}}. Read acceptance-assumptions.md,
      acceptance-preparation-status.txt, acceptance-flow-evidence.md,
      acceptance-findings.md from {{session_dir}}/output/. Also read
      {{artifact_dir}}/resume.json and commits after acceptance.
      Write {{artifact_dir}}/review-attention.json with red, orange, yellow, white
      arrays of {title, detail, link}, accepted_head SHA, and later_commits: every
      commit after accepted_head, each also named by SHA in an orange item, except
      the archive commit and the workflow's phase checkpoint commits (subjects
      beginning `[archive]` or `[factory-feature]`), which only move OpenSpec files
      and which you leave out of both. A link is
      a repository-relative path of a committed file, citing the line or range that
      shows the item (path:12 or path:12-18) where one exists, or a URL; any other
      path is shown as a link to the acceptance evidence.
      Classify every review item into exactly one tier, and make items that share
      one root cause a single item in the highest tier any of them reaches, its
      detail listing each symptom. Red: each acceptance criterion that failed, each
      that could not be verified and that no automated test covers, acceptance that
      did not complete, every known deviation from the specifications or from a
      decision the issue settled, and a resume or continuation that fell back to a
      fresh start in resume.json. Orange: choices the issue did not settle that
      change scope, weaken a guarantee, affect other callers, or are costly to
      reverse; plan revisions made in response to human comments; rejected high or
      medium review findings; and commits added after acceptance that its evidence
      does not cover. The item naming those commits states their size as `git diff
      --shortstat <accepted_head> HEAD` prints it (N files changed, ...) and has a
      sentence starting `Tests:` that names the tests covering them or says none do.
      Group related orange choices into one item per topic whose detail cites the
      decision IDs behind it, and order orange most important first: the pull request
      shows commits after acceptance first, then the most important remaining orange
      items, up to five in total, and collapses the rest. Yellow: each acceptance
      criterion acceptance did not exercise but a named automated test covers,
      naming that test in its detail and linking it where possible; every item that
      only follows a decision the issue settled or an acceptance criterion, which is
      never orange or red; and every other recorded assumption or decision. White:
      passed acceptance criteria with evidence.
  - id: verify-classification
    command: python3 .agent-runner/workflows/verify-classification.py "{{artifact_dir}}/review-attention.json"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test "{{validator_status}}" != passed'
    repair:
      session: lead-agent
      prompt: |
        Correct {{artifact_dir}}/review-attention.json so it satisfies the
        classification rules and fixes each reported problem. Change only that file.
  - id: seed-ci-status
    command: printf passed
    capture: ci_status
  - id: finalize
    workflow: builtin:core/finalize-pr-v1.0.yaml
    params:
      ci_fix_cycles: "3"
    continue_on_failure: true
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test "{{validator_status}}" != passed || .agent-runner/workflows/factory-resume-skip.sh "{{effective_resume}}" finalize'
  - id: mark-ci-failed
    command: printf failed
    capture: ci_status
    skip_if: previous_success
  - id: seed-annotation-status
    command: printf passed
    capture: annotation_status
  - id: annotate-pr
    script: annotate-pr.sh
    script_inputs:
      artifact_dir: "{{artifact_dir}}"
      issue_file: "{{issue_file}}"
      change_name: "{{change_name}}"
      archived_dir: "{{archived_dir}}"
      session_dir: "{{session_dir}}"
      target_head: "{{target_head}}"
    continue_on_failure: true
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json || test "{{validator_status}}" != passed'
  - id: mark-annotation-failed
    command: printf failed
    capture: annotation_status
    skip_if: previous_success
  - id: pr-details
    command: |
      gh pr list --head "{{branch_name}}" --state open --json url,number,headRefOid --limit 1 | python3 -c 'import json,sys; print(json.dumps((json.load(sys.stdin) or [{}])[0]))'
    capture: pr_details
    continue_on_failure: true
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json'
  - id: record-outcome
    script: record-outcome.sh
    script_inputs:
      contract: factory-feature/1
      outcome_path: "{{artifact_dir}}/feature-outcome.json"
      validator_status: "{{validator_status}}"
      ci_status: "{{ci_status}}"
      annotation_status: "{{annotation_status}}"
      branch_name: "{{branch_name}}"
      pr_details: "{{pr_details}}"
      review_attention_counts: "{{artifact_dir}}/review-attention.json"
      verify_failure: "{{artifact_dir}}/verify-failure.json"
      resume: "{{artifact_dir}}/resume.json"
    skip_if: 'sh: test -s {{artifact_dir}}/feature-outcome.json'
  - id: verify-outcome
    command: python3 .agent-runner/workflows/verify-feature-outcome.py "{{artifact_dir}}/feature-outcome.json"
