auto_merge = true
repository = "Codagent-AI/agent-factory"
agent = "claude:claude-sonnet-5-5:medium"

[watch.expected_checks]
"Codagent-AI/agent-runner" = ["route / route", "build", "security-code", "lint", "test", "security-deps", "CodeRabbit"]
