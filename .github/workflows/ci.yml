name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset on main requires this job's check, so auto-merge waits for it.
  check:
    # The service runs on macOS, and some tests exercise macOS process behavior.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright

      - name: Exec probe (temporary)
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, time
          d = tempfile.mkdtemp()
          for i in range(5):
              p = f"{d}/s{i}"
              open(p, "w").write("#!/bin/sh\nexit 0\n")
              os.chmod(p, 0o755)
              s = time.time(); subprocess.run([p]); a = time.time() - s
              s = time.time(); subprocess.run([p]); b = time.time() - s
              print(f"new exec {a*1000:.1f} ms, again {b*1000:.1f} ms")
          PY

      - name: Test
        run: uv run pytest --durations=40
