name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset on main requires this job's check, so auto-merge waits for it.
  check:
    # The service runs on macOS, and some tests exercise macOS process behavior.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright

      - name: Keep test files on an unindexed RAM disk
        # The tests create many short-lived files and executables. On the hosted runner,
        # Spotlight and other system services reacting to them took a large share of
        # the 3 vCPUs the tests need.
        run: |
          sudo mdutil -a -i off
          device="$(hdiutil attach -nomount ram://2097152 | awk '{print $1}')"
          newfs_hfs -v FactoryTests "$device"
          mkdir "$RUNNER_TEMP/ram"
          # nobrowse keeps Finder from showing, and so watching, the volume.
          diskutil mount -mountOptions nobrowse -mountPoint "$RUNNER_TEMP/ram" "$device"
          sudo mdutil -i off "$RUNNER_TEMP/ram"
          mkdir "$RUNNER_TEMP/ram/tmp"
          echo "TMPDIR=$RUNNER_TEMP/ram/tmp" >> "$GITHUB_ENV"

      - name: Test
        run: uv run pytest --durations=20
