name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset on main requires this job's check, so auto-merge waits for it.
  check:
    # The service runs on macOS, and some tests exercise macOS process behavior.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright

      - name: Keep test files on an unindexed RAM disk
        # The tests create many short-lived files and executables. On the hosted runner,
        # Spotlight and the file-event log reacting to them took a large share of the
        # 3 vCPUs the tests need.
        run: |
          sudo mdutil -a -i off
          device="$(hdiutil attach -nomount ram://2097152 | awk '{print $1}')"
          diskutil erasevolume APFS FactoryTests "$device"
          sudo mdutil -i off /Volumes/FactoryTests
          sudo mkdir -p /Volumes/FactoryTests/.fseventsd
          sudo touch /Volumes/FactoryTests/.fseventsd/no_log
          diskutil unmount /Volumes/FactoryTests
          diskutil mount "$device"
          mkdir /Volumes/FactoryTests/tmp
          echo "TMPDIR=/Volumes/FactoryTests/tmp" >> "$GITHUB_ENV"

      - name: Test
        run: |
          iostat -w 5 > iostat.log &
          sampler=$!
          top -l 0 -s 10 -o cpu -n 15 -stats pid,command,cpu,time > top.log &
          topper=$!
          status=0
          uv run pytest --durations=20 || status=$?
          kill "$sampler" "$topper"
          cat iostat.log
          grep -E '^[0-9]+ ' top.log | awk '{c = $2; for (i = 3; i < NF - 1; i++) c = c "_" $i; cpu[c] += $(NF - 1)} END {for (c in cpu) printf "%8.1f %s\n", cpu[c], c}' | sort -rn | head -40
          exit "$status"
